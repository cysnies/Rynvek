rynvek-core.workspace = true
rynvek-ecs.workspace = true
rynvek-field.workspace = true
rynvek-journal.workspace = true
rynvek-neural.workspace = true
rynvek-snapshot.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
