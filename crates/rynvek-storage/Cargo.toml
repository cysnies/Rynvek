[package]
name = "rynvek-storage"
description = "Rynvek Tier 1 存储引擎：StorageEngine Trait、SQLite/Postgres DDL、CAS BlobStore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
rynvek-core.workspace = true
serde.workspace = true
serde_json.workspace = true

# SQLite 适配依赖 C 编译的 libsqlite3（bundled），wasm32-unknown-unknown 无 libc 无法构建；
# 浏览器 Worker 内的持久化改走 OPFS（后续里程碑），故仅在非 wasm32 目标启用
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
