[package]
name = "rynvek-rules"
description = "Rynvek Tier 2 规则编译器：36 条 Typed SSA Rule IR、静态分析、WGSL/CPU 双后端与 QuickJS-NG 确定性沙箱"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["quickjs"]
# Tier-1 原生权威沙箱；浏览器 unknown-unknown 不支持 C 运行时，必须显式拒绝本地执行。
quickjs = ["dep:rquickjs"]
# Tier-2 WASM 插件宿主（Wasmtime 29 Component Model，`rynvek:plugin@1.0.0`）
wasmtime = ["dep:wasmtime", "dep:wasmparser"]

[dependencies]
blake3.workspace = true
rynvek-core.workspace = true
serde.workspace = true
serde_json.workspace = true
wasmparser = { version = "0.221", optional = true, default-features = false, features = ["std"] }
wasmtime = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rquickjs = { workspace = true, optional = true }

[dev-dependencies]
naga.workspace = true
# 插件宿主测试中的负面夹具（WAT 文本）
wat = "1"

[lints]
workspace = true
