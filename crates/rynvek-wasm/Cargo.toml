[package]
name = "rynvek-wasm"
description = "Rynvek Tier 4 浏览器 Dedicated Engine Worker 入口：OffscreenCanvas 绑定、Worker 宿主状态机与 wasm-bindgen ABI 桥"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib 供 wasm-bindgen 生成 Worker 胶水；rlib 供原生单元 / 集成测试
crate-type = ["cdylib", "rlib"]

[dependencies]
rynvek-core.workspace = true
rynvek-engine.workspace = true
rynvek-wgpu.workspace = true
serde_json.workspace = true
wgpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["OffscreenCanvas"] }

[lints]
workspace = true
