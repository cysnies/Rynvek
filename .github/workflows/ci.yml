name: Rynvek Deterministic CI Gate

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # 标准 Runner 在全工作区测试链接时耗尽磁盘；仅去除调试符号，不关闭断言或减少检查。
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  ci-full-gate:
    name: Full Deterministic & Compliance Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & pnpm 10
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust 1.87 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip2

      # 先生成真实同版本 Worker ABI，后续 typecheck/build 不靠提交旧二进制过门禁。
      - name: Build browser WASM and verify generated ABI
        run: |
          command -v clang
          TOOLS="$RUNNER_TEMP/rynvek-wasm-tools"
          mkdir -p "$TOOLS"
          curl --fail --location --max-time 90 --max-filesize 16000000 --output "$TOOLS/cli.tar.gz" https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  $TOOLS/cli.tar.gz" | sha256sum --check
          tar -xzf "$TOOLS/cli.tar.gz" -C "$TOOLS"
          export WASM_BINDGEN="$TOOLS/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl/wasm-bindgen"
          echo "WASM_BINDGEN=$WASM_BINDGEN" >> "$GITHUB_ENV"
          node apps/web-platform/tools/build-wasm.mjs
          node --test apps/web-platform/tools/wasm-abi.test.mjs

      - name: Run Rynvek CI Full Gate
        run: cargo xtask ci-full-gate --soak-duration 90s
