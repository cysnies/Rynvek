name: Rynvek Deterministic CI Gate

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # 标准 Runner 在全工作区测试链接时耗尽磁盘；仅去除调试符号，不关闭断言或减少检查。
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  ci-full-gate:
    name: Full Deterministic & Compliance Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & pnpm 10
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust 1.87 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip2

      - name: Run Rynvek CI Full Gate
        run: cargo xtask ci-full-gate --soak-duration 90s
