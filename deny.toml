# deny.toml
# SPDX-FileCopyrightText: 2026 The Rynvek Contributors
# SPDX-License-Identifier: AGPL-3.0-only

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.95

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 工作区内部 crate 均 `publish = false`，以路径依赖互相引用（不视为通配版本）
allow-wildcard-paths = true
