# SPDX-FileCopyrightText: 2026 The Rynvek Contributors
# SPDX-License-Identifier: AGPL-3.0-only

# REUSE 3.3 批量许可证声明：覆盖无法内嵌 SPDX 注释头的文件（JSON、锁文件、文档等）。
# 源代码文件一律在文件头直接写入 SPDX 注释，不依赖本文件。
version = 1

# 仓库级工程配置与锁文件：随核心平台采用 AGPL-3.0-only。
[[annotations]]
path = [
    "Cargo.lock",
    "package.json",
    "pnpm-lock.yaml",
    "turbo.json",
    "tsconfig.base.json",
    "tests/**",
    "crates/**/Cargo.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Rynvek Contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# 平台前端包与宿主应用（引擎宿主、设计系统、音频、可视化、资产、Studio、WASM、Web/Desktop 应用）的元数据与夹具：AGPL-3.0-only。
# REUSE 中后出现的匹配项优先，故通用规则放在 SDK 例外规则之前。
[[annotations]]
path = ["packages/**/*.json", "apps/**/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Rynvek Contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# 公开协议与客户端 SDK 包的元数据：Apache-2.0 WITH LLVM-exception（见项目文档 7.1）。
[[annotations]]
path = [
    "protocols/**",
    "packages/core/**/*.json",
    "packages/protocol/**/*.json",
    "packages/rules/**/*.json",
    "packages/agent-sdk/**/*.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Rynvek Contributors"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

# 官方文档：CC-BY-4.0（ADR-L007）。
[[annotations]]
path = ["docs/**", "README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Rynvek Contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Python `rynvek` 包的锁文件与类型标记、示例插件锁文件与编译出的插件夹具：Apache-2.0 WITH LLVM-exception（GAP-15）。
# 原生扩展源码（python/native）在文件头单独声明 AGPL-3.0-only。
[[annotations]]
path = [
    "python/uv.lock",
    "python/rynvek/py.typed",
    "examples/plugins/**/Cargo.lock",
    "crates/rynvek-rules/tests/fixtures/plugin/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Rynvek Contributors"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"
