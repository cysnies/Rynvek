# Rynvek Cargo 工作区根配置。
# 成员 crate 严格遵循规范 01 的单向分层依赖 DAG（Tier 0 → Tier 4，严禁逆向或循环依赖）。
[workspace]
resolver = "3"
members = ["crates/*", "python/native"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87.0"
authors = ["The Rynvek Contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/rynvek/rynvek"
publish = false

[workspace.dependencies]
# --- 内部 crate（按 Tier 分层引用）---
rynvek-core = { path = "crates/rynvek-core" }
rynvek-schema = { path = "crates/rynvek-schema" }
rynvek-protocol = { path = "crates/rynvek-protocol" }
rynvek-memory = { path = "crates/rynvek-memory" }
rynvek-ecs = { path = "crates/rynvek-ecs" }
rynvek-storage = { path = "crates/rynvek-storage" }
rynvek-journal = { path = "crates/rynvek-journal" }
rynvek-snapshot = { path = "crates/rynvek-snapshot" }
rynvek-compute = { path = "crates/rynvek-compute" }
rynvek-compute-cpu = { path = "crates/rynvek-compute-cpu" }
rynvek-field = { path = "crates/rynvek-field" }
rynvek-spatial = { path = "crates/rynvek-spatial" }
rynvek-simulation = { path = "crates/rynvek-simulation" }
rynvek-neural = { path = "crates/rynvek-neural" }
rynvek-rules = { path = "crates/rynvek-rules", default-features = false }
rynvek-wgpu = { path = "crates/rynvek-wgpu" }
rynvek-render = { path = "crates/rynvek-render" }
rynvek-rts = { path = "crates/rynvek-rts" }
rynvek-world = { path = "crates/rynvek-world" }
rynvek-agent = { path = "crates/rynvek-agent" }
rynvek-audio = { path = "crates/rynvek-audio" }
rynvek-engine = { path = "crates/rynvek-engine" }
rynvek-security = { path = "crates/rynvek-security" }
rynvek-network = { path = "crates/rynvek-network" }
rynvek-cli = { path = "crates/rynvek-cli" }
rynvek-server = { path = "crates/rynvek-server" }

# --- 第三方依赖（版本统一在此锁定，成员 crate 通过 `workspace = true` 继承）---
blake3 = "1.8"
bytemuck = { version = "1.23", features = ["derive"] }
# Ed25519 签名（规范 1.1 密码学冻结：BLAKE3-256 / Ed25519）
ed25519-dalek = "2.2"
getrandom = "0.2"
# --- M7 服务端 / 网络栈 ---
axum = { version = "0.8", features = ["ws"] }
# HTTP API 中 96 字节 CapabilityToken 的文本承载（Bearer）
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# 实时流负载压缩：LZ4 Frame（规范 1.1）
lz4_flex = "0.11"
# 网络控制信令：Protobuf v3（GAP-16）
prost = "0.13"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util", "signal"] }
tokio-postgres = "0.7"
tokio-tungstenite = "0.26"
wtransport = { version = "0.6", features = ["self-signed"] }
half = "2.4"
# 浏览器 Worker ABI（与 wgpu 30.0.1 的 WebGPU 后端所用版本一致）
js-sys = "0.3.107"
naga = { version = "30", features = ["wgsl-in"] }
pollster = "0.4"
rquickjs = { version = "0.11", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tempfile = "3.20"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
# 规范 07 §7.1 冻结：wgpu 30.0.1（精确锁定，严禁降级）
wgpu = "=30.0.1"
zstd = "0.13"
# --- M8 科研接口 / 插件宿主（规范 1.1：Arrow 53+、PyO3 0.23+、Wasmtime 29.0）---
arrow = { version = "54", default-features = false }
parquet = { version = "54", default-features = false, features = ["arrow", "zstd"] }
pyo3 = { version = "0.23", features = ["abi3-py312"] }
wasmtime = { version = "29", default-features = false, features = ["cranelift", "component-model", "runtime", "std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"

[profile.test]
opt-level = 1

# 需要接近 release 仿真速度、又要求增量重建足够快的本地工具构建：
# Python 原生扩展（`maturin develop --profile opt-dev`）与浸泡测试（`cargo xtask soak`）
[profile.opt-dev]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
